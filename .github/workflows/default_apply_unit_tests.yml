      #       TERRATEST_ARGS+=("-v")
      #     fi

      #     docker run \
      #       --rm \
      #       -e TF_VAR_subscription_id="${TF_VAR_subscription_id}" \
      #       -e TF_VAR_tenant_id="${TF_VAR_tenant_id}" \
      #       -e TF_VAR_client_id="${TF_VAR_client_id}" \
      #       -e TF_VAR_client_secret="${TF_VAR_client_secret}" \
      #       -e TF_VAR_public_cidrs="${PUBLIC_CIDRS_JSON}" \
