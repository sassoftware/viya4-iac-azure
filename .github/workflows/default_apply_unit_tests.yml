name: Manual Apply Integration Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        name: Branch
        description: Git branch to test
        required: false
        default: apply-terratest
        type: string
      test_filter:
        name: Terratest Name
        description: Terratest test name filter to run
        required: false
        default: 'TestApplyDefaultMain'
        type: string
      test_package:
        name: Terratest Package
        description: Go package pattern to test
        required: false
        default: './defaultapply'
        type: string
      verbose:
        description: Run go test in verbose mode
        required: false
        default: false
        type: boolean
      # artifact_run_id:
      #   description: Previous workflow run ID to download apply-test-results-23 from
      #   required: false
      #   default: ''
      #   type: string

jobs:
  terratest-apply:
    name: Manual Apply Integration Tests
    runs-on: ubuntu-latest
    environment: terraformSecrets
    permissions:
      contents: read
      actions: read

    env:
      TF_VAR_subscription_id: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.TF_VAR_TENANT_ID }}
      TF_VAR_client_id: ${{ secrets.TF_VAR_CLIENT_ID }}
      TF_VAR_client_secret: ${{ secrets.TF_VAR_CLIENT_SECRET }}
      TF_VAR_public_access_cidrs: ${{ secrets.TF_VAR_PUBLIC_ACCESS_CIDRS }}
      DOCKER_IMAGE_TAG: 'viya4-iac-azure:terratest'
      TEST_FILTER: ${{ inputs.test_filter }}
      TEST_PACKAGE: ${{ inputs.test_package }}
      VERBOSE: ${{ inputs.verbose }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Verify Checked Out Ref
        shell: bash
        run: |
          echo "Requested ref input: ${{ inputs.ref }}"
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "Checked out branch (if branch checkout): $(git rev-parse --abbrev-ref HEAD || true)"

      - name: Build Docker Image
        shell: bash
        run: |
          set -euo pipefail

          docker build -t "${DOCKER_IMAGE_TAG}" -f Dockerfile.terratest .

      - name: Get Runner Public IP
        id: runner_ip
        shell: bash
        run: |
          RUNNER_IP=$(curl -sf https://api.ipify.org)/32
          echo "ip=${RUNNER_IP}" >> "${GITHUB_OUTPUT}"
          echo "Runner public IP: ${RUNNER_IP}"

      - name: Debug Public CIDRs
        shell: bash
        run: |
          RUNNER_IP="${{ steps.runner_ip.outputs.ip }}"
          COMBINED="${TF_VAR_public_access_cidrs},${RUNNER_IP}"
          echo "TF_VAR_public_access_cidrs (raw secret): ${TF_VAR_public_access_cidrs}"
          echo "Runner IP appended: ${RUNNER_IP}"
          PUBLIC_CIDRS_JSON=$(printf '%s' "${COMBINED}" \
            | jq -Rc '[split(",")[] | ltrimstr(" ") | rtrimstr(" ")]')
          echo "PUBLIC_CIDRS_JSON (formatted for Terraform): ${PUBLIC_CIDRS_JSON}"

      - name: Run Apply Terratest
        shell: bash
        run: |
          set -euo pipefail

          
          TEST_FILTER="${{ inputs.test_filter }}"
          TEST_PACKAGE="${{ inputs.test_package }}"
          DOCKER_IMAGE_TAG='viya4-iac-azure:terratest'
          VERBOSE="${{ inputs.verbose }}"
          

          RUNNER_IP="${{ steps.runner_ip.outputs.ip }}"
          COMBINED="${TF_VAR_public_access_cidrs},${RUNNER_IP}"
          PUBLIC_CIDRS_JSON=$(printf '%s' "${COMBINED}" \
            | jq -Rc '[split(",")[] | ltrimstr(" ") | rtrimstr(" ")]')

          TERRATEST_ARGS=("-p=${TEST_PACKAGE}" "-r=${TEST_FILTER}")
          if [[ "${VERBOSE}" == "true" ]]; then
            TERRATEST_ARGS+=("-v")
          fi

          docker run \
            --rm \
            -e TF_VAR_subscription_id="${TF_VAR_subscription_id}" \
            -e TF_VAR_tenant_id="${TF_VAR_tenant_id}" \
            -e TF_VAR_client_id="${TF_VAR_client_id}" \
            -e TF_VAR_client_secret="${TF_VAR_client_secret}" \
            -e TF_VAR_public_cidrs="${PUBLIC_CIDRS_JSON}" \
            -v $(pwd):/viya4-iac-azure \
            "${DOCKER_IMAGE_TAG}" \
            "${TERRATEST_ARGS[@]}"

      # - name: Download apply-test-results-23 Artifact (Current Run)
      #   if: ${{ inputs.artifact_run_id == '' }}
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: apply-test-results-23
      #     path: test/testoutput

      # - name: Download apply-test-results-23 Artifact (Previous Run)
      #   if: ${{ inputs.artifact_run_id != '' }}
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: apply-test-results-23
      #     path: test/testoutput
      #     repository: ${{ github.repository }}
      #     run-id: 23
      #     github-token: ${{ github.token }}

      - name: Test Execution Summary
        if: always()
        shell: bash
        run: |
          REPORT_FILE="test/testoutput/report.xml"
          LOG_FILE="test/testoutput/test_output.log"

          if [[ -f "${REPORT_FILE}" ]]; then
            read -r TOTAL FAILED SKIPPED <<< "$(awk '
              function attr(name, line,    r) {
                r = name "=\"[0-9]+\""
                if (match(line, r)) {
                  return substr(line, RSTART + length(name) + 2, RLENGTH - length(name) - 3)
                }
                return 0
              }
              /<testsuite[[:space:]]/ {
                total += attr("tests", $0)
                failed += attr("failures", $0)
                skipped += attr("skipped", $0)
              }
              END {
                printf "%d %d %d", total, failed, skipped
              }
            ' "${REPORT_FILE}")"

            PASSED=$((TOTAL - FAILED - SKIPPED))
            if [[ "${PASSED}" -lt 0 ]]; then
              PASSED=0
            fi

            echo "Summary source: ${REPORT_FILE}"
            echo "Total Test Executed : ${TOTAL}"
            echo "Passed: ${PASSED}"
            echo "Failed: ${FAILED}"
            echo "Skipped: ${SKIPPED}"

            if [[ "${FAILED}" -gt 0 ]]; then
              echo "Failing Tests:"
              awk '
                /<testcase[[:space:]]/ {
                  current=""
                  if (match($0, /(^|[[:space:]])name="[^"]+"/)) {
                    current = substr($0, RSTART, RLENGTH)
                    sub(/^[[:space:]]*name="/, "", current)
                    sub(/"$/, "", current)
                  }
                }
                /<failure([[:space:]>]|$)/ {
                  if (current != "") {
                    print current
                  }
                }
              ' "${REPORT_FILE}" | sort -u | sed 's/^/- /'
            fi
            exit 0
          fi

          if [[ -f "${LOG_FILE}" ]]; then
            PASSED=$(grep -Ec '^--- PASS:' "${LOG_FILE}" || true)
            FAILED=$(grep -Ec '^--- FAIL:' "${LOG_FILE}" || true)
            SKIPPED=$(grep -Ec '^--- SKIP:' "${LOG_FILE}" || true)
            TOTAL=$((PASSED + FAILED + SKIPPED))

            echo "Summary source: ${LOG_FILE}"
            echo "Total Test Executed : ${TOTAL}"
            echo "Passed: ${PASSED}"
            echo "Failed: ${FAILED}"
            echo "Skipped: ${SKIPPED}"

            if [[ "${FAILED}" -gt 0 ]]; then
              echo "Failing Tests:"
              grep -E '--- FAIL:' "${LOG_FILE}" \
                | sed -E 's/^\s*--- FAIL: ([^ ]+).*/\1/' \
                | sort -u \
                | sed 's/^/- /'
            fi
            exit 0
          fi

          echo "Total Test Executed : 0"
          echo "Passed: 0"
          echo "Failed: 0"
          echo "Skipped: 0"
          echo "Warning: Neither ${REPORT_FILE} nor ${LOG_FILE} was found"

      - name: Upload Apply Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-test-results-${{ github.run_number }}
          path: test/testoutput/**
          if-no-files-found: warn

