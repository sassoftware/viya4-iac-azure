name: Manual Apply Integration Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        name: Branch
        description: Git branch to test
        required: false
        default: main
        type: string
      test_filter:
        name: Terratest Name
        description: Terratest test name filter to run
        required: false
        default: 'TestApplyDefaultMain'
        type: string
      test_package:
        name: Terratest Package
        description: Go package pattern to test
        required: false
        default: './defaultapply'
        type: string
      verbose:
        description: Run go test in verbose mode
        required: false
        default: false
        type: boolean

jobs:
  terratest-apply:
    name: Manual Apply Integration Tests
    runs-on: ubuntu-latest
    environment: terraformSecrets
    permissions:
      contents: read

    env:
      TF_VAR_subscription_id: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.TF_VAR_TENANT_ID }}
      TF_VAR_client_id: ${{ secrets.TF_VAR_CLIENT_ID }}
      TF_VAR_client_secret: ${{ secrets.TF_VAR_CLIENT_SECRET }}
      TF_VAR_public_access_cidrs: ${{ secrets.TF_VAR_PUBLIC_ACCESS_CIDRS }}
      DOCKER_IMAGE_TAG: 'viya4-iac-azure:terratest'
      TEST_FILTER: ${{ inputs.test_filter }}
      TEST_PACKAGE: ${{ inputs.test_package }}
      VERBOSE: ${{ inputs.verbose }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build Docker Image
        shell: bash
        run: |
          set -euo pipefail

          docker build -t "${DOCKER_IMAGE_TAG}" -f Dockerfile.terratest .

      - name: Get Runner Public IP
        id: runner_ip
        shell: bash
        run: |
          RUNNER_IP=$(curl -sf https://api.ipify.org)/32
          echo "ip=${RUNNER_IP}" >> "${GITHUB_OUTPUT}"
          echo "Runner public IP: ${RUNNER_IP}"

      - name: Debug Public CIDRs
        shell: bash
        run: |
          RUNNER_IP="${{ steps.runner_ip.outputs.ip }}"
          COMBINED="${TF_VAR_public_access_cidrs},${RUNNER_IP}"
          echo "TF_VAR_public_access_cidrs (raw secret): ${TF_VAR_public_access_cidrs}"
          echo "Runner IP appended: ${RUNNER_IP}"
          PUBLIC_CIDRS_JSON=$(printf '%s' "${COMBINED}" \
            | jq -Rc '[split(",")[] | ltrimstr(" ") | rtrimstr(" ")]')
          echo "PUBLIC_CIDRS_JSON (formatted for Terraform): ${PUBLIC_CIDRS_JSON}"

      # - name: Run Apply Terratest
      #   shell: bash
      #   run: |
      #     set -euo pipefail

          
      #     TEST_FILTER="${{ inputs.test_filter }}"
      #     TEST_PACKAGE="${{ inputs.test_package }}"
      #     DOCKER_IMAGE_TAG='viya4-iac-azure:terratest'
      #     VERBOSE="${{ inputs.verbose }}"
          

      #     RUNNER_IP="${{ steps.runner_ip.outputs.ip }}"
